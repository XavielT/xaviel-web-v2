<div class="Xbar" [class.is-hidden]="hidden()">

    <div class="nav-container">

        <!-- Hamburger Button -->
        <button class="menu-toggle" (click)="toggleMenu()" type="button" [attr.aria-label]="i18n.t('nav.toggle')"
            [attr.aria-expanded]="menuOpen()">
            {{ menuOpen() ? '✖' : '☰' }}
        </button>

        <nav [class.open]="menuOpen()">
            <ul class="nav-list">
                <span class="nav-indicator" aria-hidden="true" [style.left.px]="indicator().left"
                    [style.width.px]="indicator().width" [style.opacity]="indicator().visible ? 1 : 0"></span>
                <li>
                    <a class="nav-link" href="#home" (click)="closeMenu()"
                        [class.active]="activeSection() === 'home'">{{ i18n.t('nav.home') }}</a>
                </li>
                <li>
                    <a class="nav-link" href="#about" (click)="closeMenu()"
                        [class.active]="activeSection() === 'about'">{{ i18n.t('nav.about') }}</a>
                </li>
                <li>
                    <a class="nav-link" href="#main-projects" (click)="closeMenu()"
                        [class.active]="activeSection() === 'main-projects'">{{ i18n.t('nav.projects') }}</a>
                </li>
                <li>
                    <a class="nav-link" href="#apps" (click)="closeMenu()"
                        [class.active]="activeSection() === 'apps'">{{ i18n.t('nav.apps') }}</a>
                </li>
                <li>
                    <a class="nav-link" href="#skills" (click)="closeMenu()"
                        [class.active]="activeSection() === 'skills'">{{ i18n.t('nav.skills') }}</a>
                </li>
                <li>
                    <a class="nav-link" href="#certificates" (click)="closeMenu()"
                        [class.active]="activeSection() === 'certificates'">{{ i18n.t('nav.certificates') }}</a>
                </li>
                <li>
                    <a class="nav-link" href="#contact" (click)="closeMenu()"
                        [class.active]="activeSection() === 'contact'">{{ i18n.t('nav.contact') }}</a>
                </li>
            </ul>
        </nav>

        <button type="button" class="lang-toggle" (click)="i18n.toggle()" [attr.aria-label]="i18n.t('nav.lang')"
            [attr.lang]="i18n.lang() === 'en' ? 'es' : 'en'">
            <span [class.on]="i18n.lang() === 'en'">EN</span><span class="lang-sep">/</span><span [class.on]="i18n.lang() === 'es'">ES</span>
        </button>

    </div>
</div>
