<div class="rm-wrap" [class.rm-fade]="overflowing && !expanded">
    <p #body class="rm-body"
        [style.max-height.px]="!overflowing ? null : expanded ? fullHeight : collapsedHeight">{{ text }}</p>
</div>
@if (overflowing) {
<button type="button" class="rm-toggle" (click)="toggle()" [attr.aria-expanded]="expanded">
    <span>{{ expanded ? 'Read less' : 'Read more' }}</span>
    <svg class="rm-chevron" [class.rm-chevron-up]="expanded" viewBox="0 0 24 24" width="14" height="14"
        aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>
</button>
}
