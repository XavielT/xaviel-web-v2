<div class="app-card">

    <div class="app-card-head">
        <img class="app-card-icon" [src]="app.icon" alt="{{ app.name }} icon" />
        <div class="app-card-headings">
            <h3 class="app-card-name">{{ app.name }}</h3>
            <div class="app-card-badges">
                <app-badge *ngFor="let badge of app.badges" [text]="badge" variant="tech" size="sm"></app-badge>
            </div>
        </div>
    </div>

    <p class="app-card-description">{{ app.description }}</p>

    <div class="app-card-actions">
        <a *ngIf="hasWebApp" class="app-card-btn app-card-btn-primary" [href]="app.url" target="_blank"
            rel="noopener noreferrer">Open app</a>
        <span *ngIf="!hasWebApp" class="app-card-btn app-card-btn-disabled" title="Coming soon">Open app</span>

        <a *ngIf="hasApk" class="app-card-btn" [href]="app.apkUrl" target="_blank"
            rel="noopener noreferrer">Android APK</a>
        <span *ngIf="!hasApk" class="app-card-btn app-card-btn-disabled" title="Coming soon">Android APK</span>
    </div>

    <p class="app-card-ios" *ngIf="app.iosHint">{{ app.iosHint }}</p>
</div>
