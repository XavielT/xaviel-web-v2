<div class="card" [ngClass]="'card-' + computedVariant" (mousemove)="onMove($event)">

    <img class="card-img" loading="lazy" decoding="async" [src]="project.image" alt="{{ project.title }}" />

    <div class="title-container">
        <a class="card-link" href="{{ project.url }}" target="_blank" rel="noopener noreferrer"><h3>{{ project.title }}</h3>
        <img class="card-link-icon" src="/assets/icons/link-hub.svg" alt="" aria-hidden="true" /></a>
    </div>
    <app-read-more class="card-description" [text]="project.description" [lines]="3"></app-read-more>


    <div class="badges">
        <!--badges-->
        <app-badge *ngFor="let badge of project.badges" [text]="badge" variant="tech" size="sm" class="tag">
        </app-badge>
    </div>
</div>
